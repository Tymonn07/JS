		Pytania:
		1. Wymień cztery sposoby wyprowadzania danych w JS,<br>
		<b><UL>
			<li>z użyciem dokument.write()
			<li>z użyciem okienka alert()
			<li>do okienek formularza
			<li>do tabeli
		</UL></b><br><br>
		
		2. Czym jest funkcja w JS, omów przy użyciu 4 podpunktów?<br>
		<b><UL>
			<li>Jest to zbiór zgrupowanych instrukcji, które możemy uruchamiać poprzez podanie ich nazwy,
			<li>Każda funkcja po wywołaniu wykonuje swój wewnętrzny kod,
			<li>Funkcja może mieć argumenty, które wchodzą do wnętrza funkcji i są tam przetwarzane np. suma_kuz(a, b),
			<li>Może(nie zawsze) zwrócić obliczoną wartość zapisaną po słowie kluczowym return.
		</UL></b><br><br>
		
		3. Omów metody getElementsByName, getElementById, getElementByTagName (może być w postaci tabeli),<br>
		<b><table>
		<tr><th>Metoda</th><th>opis</th></tr>
		<tr><th>getElementById("id ")</th><th>dostęp do wszystkich elementów o konkretnej wartości atrybutu id</th></tr>
		<tr><th>getElementByTagName("znacznik ")</th><th>dostęp do wszystkich elementów o typie znacznika, np. P lub DIV</th></tr>
		<tr><th>getElementByName("nazwa")</th><th>dostęp do wszystkich elementów o konkretnej wartości atrybutu</th></tr>
		</table></b><br><br>
		
		4. Omów właściwości innerHTML innerText className. (każdą osobno)<br>
		<b><UL>
			<li>innerHTML – jest to właściwość, która umożliwia odczyt, zmodyfikowanie, wstawienie, albo usunięcie kodu HTML z danego elementu HTML np. w tabeli,
			<li>innerText – umożliwia określenie ciągu znaków który zostanie umieszczony w elemencie,
			<li>className – umożliwia określenie klasy CSS użytej do prezentacji elementu.
		</UL></b><br><br>

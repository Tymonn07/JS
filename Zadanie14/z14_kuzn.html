<!DOCTYPE html>
<html>
	<head>
	</head>
	<body>
		<div style="color:green;font-size:41px;">
			<script language="JavaScript">
				var m_Kuz=parseFloat(prompt("M_kuz=",""));
				
				var pierwsza=parseFloat(m_Kuz+1);
				var druga=parseFloat(m_Kuz*(m_Kuz+1));
				var trzecia=parseFloat(pierwsza+1);
				var czwarta=parseFloat(pierwsza*(pierwsza+1));
				
				if (m_Kuz>0) {
					document.write("1/"+m_Kuz+"=1/"+trzecia+"+1/"+czwarta+"+1/"+druga);
				} else {
					document.write("dane niepoprawne");
				}
			</script>
		</div>
	</body>
</html>

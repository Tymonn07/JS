<!DOCTYPE html>
<html lang= "pl-PL">
	<head>
		<META HTTP-EQUIV="content-type" CONTENT="text/html;" CHARSET="iso-8859-2" CHARSET="UTF-8">
	</head>
	<body>
		<textarea cols="150" rows="50">
<!DOCTYPE html>
<html>
	<head>
		<title> Użycie fukcji </title>
		<meta charset="utf-8">
	</head>
	<body>
		<div style="color:navy;font-size:50px;">
			<script language="JavaScript">
				var a=parseFloat(prompt("a=",""));
				var b=parseFloat(prompt("b=",""));
				function suma_kuz(a, b) {
				return a + b;
				}
				function odejmowanie_kuz(a, b) {
				return a - b;
				}
				function mnozenie_kuz(a, b) {
				return a * b;
				}
				function kwadrat1_kuz(a, b) {
				return a * a;
				}
				function kwadrat2_kuz(a, b) {
				return b * b;
				}
				function reszta_kuz(a, b) {
				return a % b;
				}
				document.write("suma="+suma_kuz(a,b)+"<br>");
				document.write("odejmowanie="+odejmowanie_kuz(a,b)+"<br>");
				document.write("mnozenie="+mnozenie_kuz(a,b)+"<br>");
				document.write("kwadrat z "+a+"="+kwadrat1_kuz(a,b)+"<br>");
				document.write("kwadrat z "+b+"="+kwadrat2_kuz(a,b)+"<br>");
				document.write("reszta z dzielenia="+reszta_kuz(a,b)+"<br>");
			</script>
		</div>
	</body>	
</html>
		</textarea>
	</body>
</html>

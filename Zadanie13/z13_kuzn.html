	<body>
		<div style="color:green;font-size:41px;">
			<script language="JavaScript">
				var m=parseFloat(prompt("M_kuz=",""));
				
				var pierwsza=parseFloat(m+1);
				var druga=parseFloat(m*(m+1));
				
				if (m>0) {
					document.write("1/"+m+"=1/"+pierwsza+"+1/"+druga);
				} else {
					document.write("dane niepoprawne");
				}
			</script>
		</div>
